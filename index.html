<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER//ARENA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040b;
    font-family:Consolas,"Courier New",monospace;
}

body{
    color:#00f6ff;
}

button{
    font-family:inherit;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            #07172d 0%,
            #030816 42%,
            #01030a 100%
        );
}

/* Cyber grid */

#game::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(
            rgba(0,246,255,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,246,255,.055) 1px,
            transparent 1px
        );
    background-size:40px 40px;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;
    z-index:100;
    top:8px;
    left:8px;
    right:8px;
    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    border:1px solid #008ea5;
    background:rgba(1,7,17,.94);

    box-shadow:
        0 0 20px rgba(0,246,255,.12),
        inset 0 0 20px rgba(0,246,255,.025);
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;

    color:#00f6ff;

    text-shadow:
        0 0 7px #00f6ff,
        0 0 20px rgba(0,246,255,.65);
}

.topStats{
    display:flex;
    gap:30px;
    text-align:center;
}

.stat{
    font-size:9px;
    color:#7beaf2;
    letter-spacing:1px;
}

.stat b{
    display:block;
    margin-top:3px;
    color:#fff;
    font-size:15px;
}

/* =========================================================
   ARENA
========================================================= */

#arena{
    position:absolute;
    z-index:5;

    top:78px;
    left:8px;
    right:8px;
    bottom:8px;

    overflow:hidden;

    border:1px solid #006d80;

    background:
        radial-gradient(
            circle at center,
            rgba(0,90,130,.07),
            transparent 65%
        );
}

/* =========================================================
   UI
========================================================= */

#hpUI{
    position:absolute;
    z-index:110;

    top:14px;
    left:18px;
}

.hpTitle{
    font-size:10px;
    color:#7beaf2;
    margin-bottom:5px;
}

.hpContainer{
    width:180px;
    height:13px;

    border:1px solid #00f6ff;
    background:#03131a;
}

#playerHP{
    width:100%;
    height:100%;

    background:#00f6ff;

    box-shadow:
        0 0 8px #00f6ff,
        inset 0 0 8px #00f6ff;

    transition:width .15s;
}

#hpNumber{
    margin-left:5px;
    font-size:11px;
    color:#fff;
}

#stageUI{
    position:absolute;
    z-index:110;

    top:15px;
    right:18px;

    color:#ff00e6;

    font-size:13px;
    font-weight:bold;

    text-shadow:
        0 0 8px #ff00e6;
}

#stateUI{
    margin-top:5px;
    font-size:9px;
    text-align:right;
    color:#7beaf2;
}

/* =========================================================
   SKILLS
========================================================= */

#skills{
    position:absolute;
    z-index:110;

    top:50px;
    left:18px;

    display:flex;
    flex-wrap:wrap;

    gap:5px;

    max-width:620px;
}

.skill{
    padding:5px 8px;

    border:1px solid #00dce8;

    color:#00f6ff;

    background:rgba(1,20,31,.88);

    font-size:9px;

    box-shadow:
        0 0 7px rgba(0,246,255,.2);
}

.skill.legendary{
    border-color:#ff00e6;
    color:#ff7bf2;

    box-shadow:
        0 0 12px rgba(255,0,230,.3);
}

/* =========================================================
   PLAYER
========================================================= */

#player{
    position:absolute;

    width:42px;
    height:42px;

    transform:translate(-50%,-50%);

    z-index:40;
}

.playerBody{
    width:100%;
    height:100%;

    position:relative;

    clip-path:
        polygon(
            50% 0%,
            100% 100%,
            50% 77%,
            0% 100%
        );

    background:#00f6ff;

    filter:
        drop-shadow(0 0 7px #00f6ff)
        drop-shadow(0 0 16px #00f6ff);
}

.playerCore{
    position:absolute;

    width:9px;
    height:9px;

    left:16px;
    top:17px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 15px #00f6ff;
}

/* =========================================================
   PET
========================================================= */

.pet{
    position:absolute;

    width:28px;
    height:28px;

    transform:translate(-50%,-50%);

    z-index:35;

    clip-path:
        polygon(
            50% 0%,
            100% 100%,
            50% 75%,
            0% 100%
        );

    background:#a800ff;

    filter:
        drop-shadow(0 0 8px #a800ff)
        drop-shadow(0 0 15px #a800ff);
}

.petCore{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:white;
    left:11px;
    top:13px;
}

/* =========================================================
   ENEMY
========================================================= */

.enemy{
    position:absolute;

    width:34px;
    height:34px;

    transform:translate(-50%,-50%);

    z-index:25;
}

.enemyBody{
    width:100%;
    height:100%;

    background:#3b0522;

    border:2px solid #ff247f;

    clip-path:
        polygon(
            50% 0%,
            82% 15%,
            100% 50%,
            82% 85%,
            50% 100%,
            18% 85%,
            0% 50%,
            18% 15%
        );

    box-shadow:
        0 0 8px #ff247f,
        inset 0 0 9px #ff247f;
}

.enemyEye{
    position:absolute;

    width:7px;
    height:7px;

    left:13px;
    top:12px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff;
}

/* =========================================================
   BOSS
========================================================= */

.boss{
    width:96px;
    height:96px;

    z-index:50;
}

.bossBody{
    width:100%;
    height:100%;

    background:
        radial-gradient(
            circle,
            #5b0017 0%,
            #210008 55%,
            #090006 100%
        );

    border:3px solid #ff0059;

    clip-path:
        polygon(
            50% 0%,
            64% 13%,
            86% 4%,
            82% 27%,
            100% 50%,
            82% 73%,
            86% 96%,
            63% 86%,
            50% 100%,
            37% 86%,
            14% 96%,
            18% 73%,
            0% 50%,
            18% 27%,
            14% 4%,
            36% 13%
        );

    box-shadow:
        0 0 15px #ff0059,
        0 0 35px rgba(255,0,89,.75),
        inset 0 0 25px #ff0059;
}

.bossEye{
    position:absolute;

    width:22px;
    height:22px;

    left:34px;
    top:35px;

    border-radius:50%;

    background:#ffe900;

    box-shadow:
        0 0 12px #ffe900,
        0 0 25px #ff6b00;
}

/* =========================================================
   HP BARS
========================================================= */

.enemyHP{
    position:absolute;

    width:42px;
    height:5px;

    transform:translateX(-50%);

    background:#21030d;

    border:1px solid #ff247f;

    z-index:60;
}

.enemyHPFill{
    width:100%;
    height:100%;

    background:#ff247f;

    box-shadow:0 0 7px #ff247f;
}

.bossHP{
    width:210px;
    height:12px;

    border:2px solid #ff0059;

    background:#1b0208;

    box-shadow:
        0 0 15px rgba(255,0,89,.4);
}

.bossHP .enemyHPFill{
    background:#ff0059;

    box-shadow:
        0 0 15px #ff0059;
}

/* =========================================================
   BOSS NAME
========================================================= */

.bossName{
    position:absolute;

    transform:translateX(-50%);

    z-index:70;

    color:#ff0059;

    font-size:12px;
    font-weight:bold;

    text-shadow:
        0 0 8px #ff0059;
}

/* =========================================================
   BULLETS
========================================================= */

.bullet{
    position:absolute;

    width:6px;
    height:15px;

    border-radius:6px;

    background:#00f6ff;

    box-shadow:
        0 0 9px #00f6ff;

    z-index:45;
}

.bullet.fire{
    background:#ff4d00;
    box-shadow:0 0 12px #ff4d00;
}

.bullet.ice{
    background:#b9ffff;
    box-shadow:0 0 12px #b9ffff;
}

.bullet.lightning{
    background:#fff000;
    box-shadow:
        0 0 14px #fff000;
}

.enemyBullet{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#ff0059;

    box-shadow:
        0 0 12px #ff0059;

    z-index:42;
}

/* =========================================================
   DROPS
========================================================= */

.drop{
    position:absolute;

    width:30px;
    height:30px;

    transform:translate(-50%,-50%);

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #00f6ff;

    background:#031b26;

    color:#00f6ff;

    font-size:14px;

    z-index:32;

    animation:
        dropPulse .75s infinite alternate;
}

@keyframes dropPulse{
    from{
        box-shadow:0 0 4px #00f6ff;
    }

    to{
        box-shadow:0 0 18px #00f6ff;
    }
}

/* =========================================================
   HIT EFFECT
========================================================= */

.hit{
    position:absolute;

    width:25px;
    height:25px;

    transform:translate(-50%,-50%);

    border:2px solid #fff;

    border-radius:50%;

    pointer-events:none;

    z-index:90;

    animation:
        hitAnimation .25s forwards;
}

@keyframes hitAnimation{

    from{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale:.3;
    }

    to{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale:2;
    }

}

/* =========================================================
   DAMAGE FLASH
========================================================= */

#damageFlash{
    position:absolute;
    inset:0;

    z-index:300;

    pointer-events:none;

    background:rgba(255,0,80,.22);

    opacity:0;
}

.damageActive{
    animation:damageFlash .18s;
}

@keyframes damageFlash{

    0%{opacity:1}
    100%{opacity:0}

}

/* =========================================================
   BOSS WARNING
========================================================= */

#bossWarning{
    position:absolute;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle,
            rgba(100,0,20,.5),
            rgba(0,0,0,.88)
        );

    text-align:center;
}

.warningSmall{
    color:#ff6b00;

    font-size:13px;

    letter-spacing:5px;

    margin-bottom:10px;
}

.warningTitle{
    color:#ff0059;

    font-size:54px;
    font-weight:bold;

    text-shadow:
        0 0 10px #ff0059,
        0 0 30px #ff0059,
        0 0 60px #ff0059;

    animation:
        warningPulse .5s infinite alternate;
}

.warningSub{
    margin-top:12px;

    color:#fff;

    font-size:14px;
}

@keyframes warningPulse{
    from{
        transform:scale(1);
        opacity:.75;
    }

    to{
        transform:scale(1.04);
        opacity:1;
    }
}

/* =========================================================
   CONTROLS
========================================================= */

#controls{
    position:absolute;

    left:18px;
    bottom:18px;

    width:150px;
    height:145px;

    z-index:120;
}

.ctrl{
    position:absolute;

    width:48px;
    height:48px;

    border:1px solid #00f6ff;

    background:rgba(1,18,28,.88);

    color:#00f6ff;

    font-size:19px;

    cursor:pointer;

    box-shadow:
        0 0 8px rgba(0,246,255,.25);
}

.ctrl:active{
    background:#00f6ff;
    color:#001018;
}

.up{
    left:51px;
    top:0;
}

.left{
    left:0;
    top:51px;
}

.down{
    left:51px;
    top:51px;
}

.right{
    left:102px;
    top:51px;
}

/* =========================================================
   MENU
========================================================= */

#menu{
    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #07172c 0%,
            #02040c 65%
        );
}

.menuTitle{
    font-size:54px;

    font-weight:bold;

    letter-spacing:4px;

    color:#00f6ff;

    text-shadow:
        0 0 10px #00f6ff,
        0 0 35px #00f6ff;
}

.menuSubtitle{
    margin-top:8px;
    margin-bottom:35px;

    color:#ff00e6;

    letter-spacing:3px;
}

.difficultyButtons{
    display:flex;
    gap:14px;
}

.diffButton{
    min-width:130px;

    padding:15px 20px;

    border:1px solid #00f6ff;

    background:#03131f;

    color:#00f6ff;

    cursor:pointer;

    transition:.2s;
}

.diffButton:hover{
    background:#00f6ff;
    color:#001018;

    box-shadow:
        0 0 25px #00f6ff;
}

/* =========================================================
   MESSAGE
========================================================= */

#message{
    position:absolute;

    inset:0;

    z-index:900;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:rgba(0,0,0,.83);

    text-align:center;
}

#messageTitle{
    font-size:48px;

    color:#00f6ff;

    text-shadow:
        0 0 20px #00f6ff;
}

#messageText{
    margin:15px 0 25px;

    color:#fff;

    font-size:13px;
}

#restart{
    padding:13px 30px;

    border:1px solid #00f6ff;

    background:#03131f;

    color:#00f6ff;

    cursor:pointer;
}

#restart:hover{
    background:#00f6ff;
    color:#001018;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .logo{
        font-size:15px;
    }

    .topStats{
        gap:10px;
    }

    .stat{
        font-size:7px;
    }

    .stat b{
        font-size:11px;
    }

    .menuTitle{
        font-size:32px;
    }

    .difficultyButtons{
        flex-direction:column;
    }

    .diffButton{
        width:180px;
    }

    .warningTitle{
        font-size:36px;
    }

}
</style>
</head>

<body>

<div id="game">

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div id="topbar">

        <div class="logo">
            CYBER//ARENA
        </div>

        <div class="topStats">

            <div class="stat">
                SCORE
                <b id="score">0</b>
            </div>

            <div class="stat">
                WAVE
                <b id="wave">1</b>
            </div>

            <div class="stat">
                COMBO
                <b id="combo">x1</b>
            </div>

        </div>

    </div>


    <!-- =====================================================
         ARENA
    ====================================================== -->

    <div id="arena">

        <div id="hpUI">

            <div class="hpTitle">
                HP
                <span id="hpNumber">100</span>
            </div>

            <div class="hpContainer">
                <div id="playerHP"></div>
            </div>

        </div>


        <div id="stageUI">

            <div>
                <span id="difficultyLabel">
                    BÌNH THƯỜNG
                </span>

                • STAGE
                <span id="stage">1</span>/5
            </div>

            <div id="stateUI">
                ENEMIES INCOMING
            </div>

        </div>


        <div id="skills"></div>


        <!-- PLAYER -->

        <div id="player">

            <div class="playerBody">

                <div class="playerCore"></div>

            </div>

        </div>


        <!-- CONTROLS -->

        <div id="controls">

            <button
                class="ctrl up"
                data-key="up">
                ▲
            </button>

            <button
                class="ctrl left"
                data-key="left">
                ◀
            </button>

            <button
                class="ctrl down"
                data-key="down">
                ▼
            </button>

            <button
                class="ctrl right"
                data-key="right">
                ▶
            </button>

        </div>

    </div>


    <!-- =====================================================
         DAMAGE FLASH
    ====================================================== -->

    <div id="damageFlash"></div>


    <!-- =====================================================
         BOSS WARNING
    ====================================================== -->

    <div id="bossWarning">

        <div class="warningSmall">
            ⚠ SYSTEM ALERT ⚠
        </div>

        <div class="warningTitle">
            BOSS INCOMING
        </div>

        <div class="warningSub">
            DEMON CLASS ENTITY DETECTED
        </div>

    </div>


    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <div id="menu">

        <div class="menuTitle">
            CYBER//ARENA
        </div>

        <div class="menuSubtitle">
            ENTER THE DIGITAL BATTLEFIELD
        </div>

        <div class="difficultyButtons">

            <button
                class="diffButton"
                data-difficulty="easy">
                EASY
            </button>

            <button
                class="diffButton"
                data-difficulty="normal">
                NORMAL
            </button>

            <button
                class="diffButton"
                data-difficulty="hard">
                HARD
            </button>

        </div>

    </div>


    <!-- =====================================================
         GAME OVER / VICTORY
    ====================================================== -->

    <div id="message">

        <h1 id="messageTitle">
            SYSTEM FAILURE
        </h1>

        <p id="messageText">
            GAME OVER
        </p>

        <button id="restart">
            CHƠI LẠI
        </button>

    </div>

</div>


<script>

/* =========================================================
   CYBER//ARENA GAME ENGINE
========================================================= */

/* =========================================================
   DOM
========================================================= */

const arena =
    document.getElementById("arena");

const playerEl =
    document.getElementById("player");

const scoreEl =
    document.getElementById("score");

const waveEl =
    document.getElementById("wave");

const comboEl =

const hpBar =

    document.getElementById("bossWarning");

    document.getElementById("damageFlash");


/* =========================================================
   GAME STATE
========================================================= */

let running = false;

/*
    Stage states:

/* =========================================================
   INPUT
========================================================= */

const keys = {

    up:false,

    left:false,
    right:false

};


/* =========================================================
   STAGE
========================================================= */

let stageKills = 0;

let targetKills = 0;

let spawnTimer = 0;

let bossTimer = null;


/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyData = {

    easy:{

        name:"DỄ",

    },

    hard:{

        spawnRate:780,

        bossMultiplier:5,

        dropBonus:1.25

    }

};


/* =========================================================
   SKILL CONFIG

const skillConfig = {

    speed:{

        max:3
    },

    rapid:{

        max:3
    },

    damage:{
        name:"💥 DAMAGE",
        max:3
    },

    double:{
        name:"🔱 2 BULLET",
        max:1
    },

    triple:{
        name:"🔱 3 BULLET",
        max:1
    },

    ultra:{

        max:1
    },

    elemental:{

        max:3
    },

    bomb:{

        max:1
    },

    missile:{
        name:"🚀 MISSILE",
        max:1
    },

    clear:{
        name:"☢ CLEAR",
        max:1
    }

};


/*
    Current skill levels.

    Không để skill xuất hiện vô hạn.
*/

const skillLevels = {

    speed:0,
    rapid:0,
    damage:0,
    double:0,
    triple:0,
    ultra:0,
    elemental:0

};


/* =========================================================
   DROP WEIGHTS
========================================================= */

const dropWeights = {

    speed:16,

    rapid:20,

    damage:18,

    double:15,

    triple:8,

    ultra:5,

    elemental:18

};


/* =========================================================
   START GAME
========================================================= */

function startGame(selectedDifficulty){

    difficulty =
        selectedDifficulty ||
        difficulty;

    running=true;

    stage=1;

    score=0;

    combo=1;

    stageState="NORMAL";

    stageKills=0;

    targetKills=0;

    spawnTimer=0;

    player.hp=100;

    player.maxHp=100;

    player.speed=4.4;

    player.damage=20;

    player.fireRate=480;

    player.lastShot=0;

    player.invincibleUntil=0;

    player.bulletCount=1;

    player.ultra=false;

    player.element=null;

    pet=null;


    Object.keys(skillLevels).forEach(key=>{

        skillLevels[key]=0;

    });


    clearAllObjects();


    skillsEl.innerHTML="";


    menu.style.display="none";

    message.style.display="none";

    bossWarning.style.display="none";


    difficultyLabel.textContent =
        difficultyData[difficulty].name;


    resetPlayer();

    startStage();

    updateUI();

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   START STAGE
========================================================= */

function startStage(){

    stageState="NORMAL";

    stageKills=0;

    spawnTimer=Date.now();

    /*
       Mỗi màn nhiều quái hơn một chút.
    */

    if(stage===5){

        targetKills =
            9 + stage * 2;

    }else{

        targetKills =
            8 + stage * 3;

    }


    stageEl.textContent=stage;

    waveEl.textContent=stage;

    setState(
        "ENEMIES INCOMING"
    );

}


/* =========================================================
   STATE UI
========================================================= */

function setState(text){

    stateUI.textContent=text;

}


/* =========================================================
   PLAYER POSITION
========================================================= */

function resetPlayer(){

    player.x =
        arena.clientWidth/2;

    player.y =
        arena.clientHeight-110;

    renderPlayer();

}


function renderPlayer(){

    playerEl.style.left =
        player.x+"px";

    playerEl.style.top =
        player.y+"px";

}


/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(){

    if(!running)
        return;

    if(keys.up)
        player.y-=player.speed;

    if(keys.down)
        player.y+=player.speed;

    if(keys.left)
        player.x-=player.speed;

    if(keys.right)
        player.x+=player.speed;


    const minX=25;

    const maxX=
        arena.clientWidth-25;

    const minY=95;

    const maxY=
        arena.clientHeight-25;


    player.x=
        Math.max(
            minX,
            Math.min(maxX,player.x)
        );

    player.y=
        Math.max(
            minY,
            Math.min(maxY,player.y)
        );


    renderPlayer();

}

        )

    }
);

    "keyup",
    event=>{

        const key =
            event.key.toLowerCase();

        if(
            key==="arrowup" ||
            key==="w"
        )
            keys.up=false;

        if(
            key==="arrowdown" ||
            key==="s"
        )
            keys.down=false;

        if(
            key==="arrowleft" ||
            key==="a"
        )
            keys.left=false;

            key==="d"
        )

/* =========================================================
   TOUCH CONTROLS
========================================================= */

document
.querySelectorAll(".ctrl")
.forEach(button=>{

    const key =
        button.dataset.key;


    button.addEventListener(
        "mousedown",
        ()=>{
            keys[key]=true;
        }
    );


    button.addEventListener(
        "mouseup",
        ()=>{
            keys[key]=false;
        }
    );


    button.addEventListener(
        "mouseleave",
        ()=>{
            keys[key]=false;
        }
    );


    button.addEventListener(
        "touchstart",
        event=>{

            event.preventDefault();

            keys[key]=true;

        }
    );


    button.addEventListener(
        "touchend",
        event=>{

            event.preventDefault();

            keys[key]=false;

        }
    );

});


/* =========================================================
   SPAWN NORMAL ENEMY
========================================================= */

function spawnEnemy(){

    /*
       Tuyệt đối không spawn quái thường
       khi Boss đang chuẩn bị hoặc đang đánh.
    */

    if(
        stageState!=="NORMAL"
    )
        return;


    const data =
        difficultyData[difficulty];


    const hp =
        data.enemyHp *
        (1 + (stage-1)*.08);


    const enemy={

        x:
            30+
            Math.random()*
            (arena.clientWidth-60),

        y:
            100+
            Math.random()*150,

        hp:hp,

        maxHp:hp,

        speed:
            data.enemySpeed+
            stage*.075,

        damage:
            data.enemyDamage,

        boss:false,

        lastAttack:0,

        attackCooldown:
            850+
            Math.random()*500,

        el:null,

        hpEl:null

    };


    createEnemyElement(enemy);

    enemies.push(enemy);

}


/* =========================================================
   CREATE ENEMY
========================================================= */

function createEnemyElement(enemy){

    const el =
        document.createElement("div");


    el.className =
        enemy.boss
        ? "enemy boss"
        : "enemy";


    const body =
        document.createElement("div");


    body.className =
        enemy.boss
        ? "bossBody"
        : "enemyBody";


    const eye =
        document.createElement("div");


    eye.className =
        enemy.boss
        ? "bossEye"
        : "enemyEye";


    body.appendChild(eye);

    el.appendChild(body);

    arena.appendChild(el);


    enemy.el=el;


    /*
       HP BAR
    */

    const hpWrap =
        document.createElement("div");


    hpWrap.className =
        enemy.boss
        ? "enemyHP bossHP"
        : "enemyHP";


    const hpFill =
        document.createElement("div");


    hpFill.className =
        "enemyHPFill";


    hpWrap.appendChild(hpFill);

    arena.appendChild(hpWrap);


    enemy.hpEl=hpWrap;


    /*
       Boss name
    */

    if(enemy.boss){

        const name =
            document.createElement("div");

        name.className="bossName";

        name.textContent=
            "☠ DEMON BOSS ☠";

        arena.appendChild(name);

        enemy.nameEl=name;

    }


    renderEnemy(enemy);

}


/* =========================================================
   BOSS SPAWN
========================================================= */

function spawnBoss(){

    /*
       Chỉ được gọi trong stage 5.
    */

    if(stage!==5)
        return;

    if(stageState==="BOSS")
        return;


    stageState="BOSS";


    const data =
        difficultyData[difficulty];


    /*
       ĐÚNG YÊU CẦU:

       EASY   = 3x
       NORMAL = 4x
       HARD   = 5x
    */

    const bossHp =
        data.enemyHp *
        data.bossMultiplier;


    const boss={

        x:
            arena.clientWidth/2,

        y:125,

        hp:bossHp,

        maxHp:bossHp,

        speed:
            data.enemySpeed*.55,

        damage:
            data.enemyDamage*1.6,

        boss:true,

        lastAttack:0,

        attackCooldown:850,

        el:null,

        hpEl:null,

        nameEl:null

    };


    createEnemyElement(boss);

    enemies.push(boss);


    setState(
        "☠ DEMON BOSS ACTIVE"
    );


    /*
       Hiệu ứng xuất hiện.
    */

    createBossExplosion(
        boss.x,
        boss.y
    );

}


/* =========================================================
   BOSS EXPLOSION
========================================================= */

function createBossExplosion(x,y){

    for(let i=0;i<12;i++){

        setTimeout(()=>{

            createHit(
                x+
                (Math.random()-.5)*100,

                y+
                (Math.random()-.5)*100
            );

}


/* =========================================================
   RENDER ENEMY
========================================================= */

function renderEnemy(enemy){

    if(!enemy.el)
        return;


    enemy.el.style.left =
        enemy.x+"px";

    enemy.el.style.top =
        enemy.y+"px";


    const barOffset =
        enemy.boss
        ? 70
        : 29;


    enemy.hpEl.style.left =
        enemy.x+"px";

    enemy.hpEl.style.top =
        (enemy.y-barOffset)+"px";


    const percent =
        Math.max(
            0,
            enemy.hp/
            enemy.maxHp*
            100
        );


    enemy.hpEl
        .firstElementChild
        .style.width=
            percent+"%";


    if(enemy.nameEl){

        enemy.nameEl.style.left =
            enemy.x+"px";

        enemy.nameEl.style.top =
            (enemy.y-87)+"px";

    }

}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

    if(enemies.length===0)
        return;


    const now=Date.now();


    /*
       for...of dùng thay vì forEach
       để tránh lỗi khi enemy chết trong loop.
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=enemies[i];


        const dx =
            player.x-enemy.x;

        const dy =
            player.y-enemy.y;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        /*
           QUÁI LUÔN ĐUỔI NGƯỜI CHƠI.
        */

        if(distance>45){

            enemy.x +=
                dx/distance*
                enemy.speed;

            enemy.y +=
                dy/distance*
                enemy.speed;

        }


        /*
           QUÁI CẬN CHIẾN.
        */

        if(
            distance<=47 &&
            now-enemy.lastAttack>
            enemy.attackCooldown
        ){

            damagePlayer(
                enemy.damage
            );

            enemy.lastAttack=now;

        }


        /*
           Boss bắn đạn.
        */

        if(
            enemy.boss &&
            now-enemy.lastAttack>
            enemy.attackCooldown
        ){

            bossShoot(enemy);

            enemy.lastAttack=now;

        }


        renderEnemy(enemy);

    }

}


/* =========================================================
   BOSS SHOOT
========================================================= */

function bossShoot(boss){

    const dx =
        player.x-boss.x;

    const dy =
        player.y-boss.y;

    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    /*
       Boss bắn 3 viên.
    */

    const baseAngle =
        Math.atan2(dy,dx);


    for(
        let i=-1;
        i<=1;
        i++
    ){

        const angle =
            baseAngle+
            i*.18;


        const speed=3.3;


        createEnemyBullet({

            x:boss.x,

            y:boss.y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            damage:
                boss.damage

        });

    }

}


/* =========================================================
   ENEMY BULLET
========================================================= */

function createEnemyBullet(data){

    const bullet={

        x:data.x,

        y:data.y,

        vx:data.vx,

        vy:data.vy,

        damage:data.damage,

        el:null

    };


    const el =
        document.createElement("div");


    el.className="enemyBullet";


    arena.appendChild(el);


    bullet.el=el;


    enemyBullets.push(bullet);

}


/* =========================================================
   AUTO SHOOT
========================================================= */

function autoShoot(){

    if(!running)
        return;


    const now=Date.now();


    if(
        now-player.lastShot<
        player.fireRate
    )
        return;


    player.lastShot=now;


    /*
       Tìm enemy gần nhất.
       Bao gồm Boss.
    */

    let target=null;

    let nearest=Infinity;


    for(const enemy of enemies){

        const dx=
            enemy.x-player.x;

        const dy=
            enemy.y-player.y;

        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(distance<nearest){

            nearest=distance;

            target=enemy;

        }

    }


    if(!target)
        return;


    const dx =
        target.x-player.x;

    const dy =
        target.y-player.y;


    const angle =
        Math.atan2(dy,dx);


    /*
       Số đường đạn.
    */

    let count =
        player.bulletCount;


    if(count===1){

        createPlayerBullet(
            angle
        );

    }


    if(count===2){

        createPlayerBullet(
            angle-.08
        );

        createPlayerBullet(
            angle+.08
        );

    }


    if(count>=3){

        createPlayerBullet(
            angle-.14
        );

        createPlayerBullet(
            angle
        );

        createPlayerBullet(
            angle+.14
        );

    }

}


/* =========================================================
   PLAYER BULLET
========================================================= */

function createPlayerBullet(angle){

    const speed =
        player.ultra
        ? 10
        : 8;


    const bullet={

        x:player.x,

        y:player.y,

        vx:
            Math.cos(angle)*
            speed,

        vy:
            Math.sin(angle)*
            speed,

        damage:
            player.damage,

        type:
            player.element ||
            "normal",

        el:null

    };


    const el =
        document.createElement("div");


    el.className="bullet";


    if(
        bullet.type==="fire"
    )
        el.classList.add("fire");


    if(
        bullet.type==="ice"
    )
        el.classList.add("ice");


    if(
        bullet.type==="lightning"
    )
        el.classList.add(
            "lightning"
        );


    arena.appendChild(el);


    bullet.el=el;


    bullets.push(bullet);

}


/* =========================================================
   BULLET UPDATE
========================================================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=bullets[i];


        bullet.x+=bullet.vx;

        bullet.y+=bullet.vy;


        bullet.el.style.left =
            bullet.x+"px";

        bullet.el.style.top =
            bullet.y+"px";


        let hit=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const enemy=enemies[j];


            const dx =
                enemy.x-bullet.x;

            const dy =
                enemy.y-bullet.y;


            const distance =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            const radius =
                enemy.boss
                ? 48
                : 23;


            if(distance<radius){

                damageEnemy(
                    enemy,
                    bullet.damage
                );

                hit=true;

                break;

            }

        }


        if(
            hit ||
            bullet.x<0 ||
            bullet.x>arena.clientWidth ||
            bullet.y<0 ||
            bullet.y>arena.clientHeight
        ){

            bullet.el.remove();

            bullets.splice(i,1);

        }

    }

}


/* =========================================================
   DAMAGE ENEMY
========================================================= */

function damageEnemy(
    enemy,
    damage
){

    /*
       Elemental damage.
    */

    if(player.element)
        damage*=1.25;


    enemy.hp-=damage;


    createHit(
        enemy.x,
        enemy.y
    );


    if(enemy.hp<=0){

        killEnemy(enemy);

    }

}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(enemy){

    const index =
        enemies.indexOf(enemy);


    if(index===-1)
        return;


    /*
       Boss chết -> bossDefeated
    */

    if(enemy.boss){

        removeEnemy(enemy);

        score+=
            2500;

        combo++;

        bossDefeated();

        return;

    }


    /*
       Normal enemy
    */

    removeEnemy(enemy);


    stageKills++;


    score+=
        100*stage;


    combo=
        Math.min(
            combo+1,
            99
        );


    /*
       Drop.
    */

    tryDrop(enemy);


    /*
       Nếu màn 5 đủ kill,
       KHÔNG spawn thêm quái.

       Chuyển sang CLEARING.
    */

    if(
        stage===5 &&
        stageKills>=targetKills &&
        stageState==="NORMAL"
    ){

        stageState="CLEARING";

        setState(
            "FINAL WAVE CLEARED"
        );

    }

}


/* =========================================================
   REMOVE ENEMY
========================================================= */

function removeEnemy(enemy){

    if(enemy.el)
        enemy.el.remove();

    if(enemy.hpEl)
        enemy.hpEl.remove();

    if(enemy.nameEl)
        enemy.nameEl.remove();


    const index =
        enemies.indexOf(enemy);


    if(index!==-1)
        enemies.splice(index,1);

}


/* =========================================================
   DROP SYSTEM
========================================================= */

function tryDrop(enemy){

    /*
       Tỉ lệ không quá cao.

       Stage 1 ~ 15%
       Stage 5 ~ 24%

       Sau đó nhân nhẹ theo difficulty.
    */

    const data =
        difficultyData[difficulty];


    const baseChance =
        .15+
        (stage-1)*.022;


    const chance =
        Math.min(
            .30,
            baseChance*
            data.dropBonus
        );


    if(
        Math.random()>
        chance
    )
        return;


    const type =
        chooseWeightedSkill();


    if(type)
        createDrop(
            enemy.x,
            enemy.y,
            type
        );

}


/* =========================================================
   CHOOSE SKILL
========================================================= */

function chooseWeightedSkill(){

    const available=[];


    for(
        const key in dropWeights
    ){

        /*
           Skill đã max thì bỏ khỏi pool.
        */

        if(
            skillLevels[key]<
            skillConfig[key].max
        ){

            available.push(key);

        }

    }


    /*
       Nếu các skill nâng cấp đã max,
       dùng bomb/missile/clear.
    */

    if(available.length===0){

        const special=[
            "bomb",
            "missile",
            "clear"
        ];

        return special[
            Math.floor(
                Math.random()*
                special.length
            )
        ];

    }


    let total=0;


    available.forEach(key=>{

        total+=
            dropWeights[key];

    });


    let roll=
        Math.random()*
        total;


    for(
        const key of available
    ){

        roll-=
            dropWeights[key];


        if(roll<=0)
            return key;

    }


    return available[0];

}


/* =========================================================
   CREATE DROP
========================================================= */

function createDrop(
    x,
    y,
    type
){

    const drop={

        x:x,

        y:y,

        type:type,

        el:null

    };


    const el =
        document.createElement("div");


    el.className="drop";


    const iconMap={

        speed:"⚡",

        rapid:"🔥",

        damage:"💥",

        double:"Ⅱ",

        triple:"Ⅲ",

        ultra:"☄",

        elemental:"🌩",

        bomb:"💣",

        missile:"🚀",

        clear:"☢"

    };


    el.textContent =
        iconMap[type] ||
        "◆";


    arena.appendChild(el);


    drop.el=el;


    drops.push(drop);

}


/* =========================================================
   DROP UPDATE
========================================================= */

function updateDrops(){

    for(
        let i=drops.length-1;
        i>=0;
        i--
    ){

        const drop=drops[i];


        drop.el.style.left =
            drop.x+"px";

        drop.el.style.top =
            drop.y+"px";


        const dx =
            player.x-drop.x;

        const dy =
            player.y-drop.y;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(distance<35){

            collectDrop(drop);


            drop.el.remove();


            drops.splice(i,1);

        }

    }

}


/* =========================================================
   COLLECT DROP
========================================================= */

function collectDrop(drop){

    const type=drop.type;


    /*
       SPECIAL SKILLS
    */

    if(type==="bomb"){

        /*
           Bomb không gây damage Boss.
        */

        for(
            const enemy of [...enemies]
        ){

            if(!enemy.boss){

                enemy.hp-=
                    enemy.maxHp*.5;


                if(enemy.hp<=0)
                    killEnemy(enemy);

            }

        }


        showSkill(
            "💣 BOMB"
        );


        return;

    }


    if(type==="missile"){

        let strongest=null;


        for(
            const enemy of enemies
        ){

            if(
                !strongest ||
                enemy.hp>
                strongest.hp
            ){

                strongest=enemy;

            }

        }


        if(
            strongest &&
            !strongest.boss
        ){

            strongest.hp-=
                strongest.maxHp*.75;


            if(strongest.hp<=0)
                killEnemy(strongest);

        }


        showSkill(
            "🚀 MISSILE"
        );


        return;

    }


    if(type==="clear"){

        /*
           CLEAR chỉ quét quái thường.
           Boss tuyệt đối không bị ảnh hưởng.
        */

        for(
            const enemy of
            [...enemies]
        ){

            if(!enemy.boss)
                killEnemy(enemy);

        }


        showSkill(
            "☢ CLEAR"
        );


        return;

    }


    /*
       NORMAL UPGRADES
    */

    if(type==="speed"){

        if(
            skillLevels.speed<
            skillConfig.speed.max
        ){

            skillLevels.speed++;

            player.speed+=.8;

            updateSkillUI(
                "speed"
            );

        }

    }


    if(type==="rapid"){

        if(
            skillLevels.rapid<
            skillConfig.rapid.max
        ){

            skillLevels.rapid++;

            player.fireRate=
                Math.max(
                    150,
                    player.fireRate*.78
                );

            updateSkillUI(
                "rapid"
            );

        }

    }


    if(type==="damage"){

        if(
            skillLevels.damage<
            skillConfig.damage.max
        ){

            skillLevels.damage++;

            player.damage*=1.35;

            updateSkillUI(
                "damage"
            );

        }

    }


    if(type==="double"){

        skillLevels.double=1;

        player.bulletCount=
            Math.max(
                player.bulletCount,
                2
            );

        updateSkillUI(
            "double"
        );

    }


    if(type==="triple"){

        skillLevels.triple=1;

        player.bulletCount=3;

        updateSkillUI(
            "triple"
        );

    }


    if(type==="ultra"){

        skillLevels.ultra=1;

        player.ultra=true;

        player.damage*=1.35;

        player.fireRate=
            Math.max(
                120,
                player.fireRate*.85
            );

        updateSkillUI(
            "ultra"
        );

    }


    if(type==="elemental"){

        if(
            skillLevels.elemental<
            skillConfig.elemental.max
        ){

            skillLevels.elemental++;

            const elements=[
                "fire",
                "ice",
                "lightning"
            ];


            player.element=
                elements[
                    Math.floor(
                        Math.random()*3
                    )
                ];


            player.damage*=1.18;


            updateSkillUI(
                "elemental"
            );

        }

    }

}


/* =========================================================
   SKILL UI
========================================================= */

function updateSkillUI(key){

    const old =
        document.getElementById(
            "skill-"+key
        );


    if(old)
        old.remove();


    const level =
        skillLevels[key];


    const config =
        skillConfig[key];


    const el =
        document.createElement("div");


    el.id=
        "skill-"+key;


    el.className=
        "skill";


    if(key==="ultra")
        el.classList.add(
            "legendary"
        );


    el.textContent =
        config.name+
        (
            config.max>1
            ?` LV.${level}`
            :""
        );


    skillsEl.appendChild(el);

}


/* =========================================================
   SPECIAL SKILL UI
========================================================= */

function showSkill(text){

    const el =
        document.createElement("div");


    el.className="skill";


    el.textContent=text;


    skillsEl.appendChild(el);


    setTimeout(()=>{

        if(el.parentNode)
            el.remove();

    },2200);

}


/* =========================================================
   ENEMY BULLETS UPDATE
========================================================= */

function updateEnemyBullets(){

    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            enemyBullets[i];


        bullet.x+=bullet.vx;

        bullet.y+=bullet.vy;


        bullet.el.style.left =
            bullet.x+"px";

        bullet.el.style.top =
            bullet.y+"px";


        const dx =
            player.x-bullet.x;

        const dy =
            player.y-bullet.y;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(distance<22){

            damagePlayer(
                bullet.damage
            );


            bullet.el.remove();

            enemyBullets.splice(
                i,
                1
            );

            continue;

        }


        if(
            bullet.x<0 ||
            bullet.x>arena.clientWidth ||
            bullet.y<0 ||
            bullet.y>arena.clientHeight
        ){

            bullet.el.remove();

            enemyBullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

    const now=Date.now();


    if(
        now<
        player.invincibleUntil
    )
        return;


    player.hp-=amount;

    player.invincibleUntil=
        now+450;


    combo=1;


    damageFlash.classList.remove(
        "damageActive"
    );


    void damageFlash.offsetWidth;


    damageFlash.classList.add(
        "damageActive"
    );


    if(player.hp<=0){

        player.hp=0;

        gameOver();

    }

}


/* =========================================================
   PET
========================================================= */

function createPet(){

    if(pet)
        return;


    pet={

        x:player.x-55,

        y:player.y,

        damage:
            player.damage,

        lastShot:0,

        el:null

    };


    const el =
        document.createElement("div");


    el.className="pet";


    const core =
        document.createElement("div");


    core.className="petCore";


    el.appendChild(core);


    arena.appendChild(el);


    pet.el=el;


    showSkill(
        "👾 PET ONLINE"
    );

}


/* =========================================================
   PET UPDATE
========================================================= */

function updatePet(){

    if(!pet)
        return;


    pet.x=
        player.x-55;


    pet.y=
        player.y+
        Math.sin(
            Date.now()/250
        )*25;


    pet.el.style.left =
        pet.x+"px";

    pet.el.style.top =
        pet.y+"px";


    if(
        Date.now()-
        pet.lastShot<
        650
    )
        return;


    let target=null;

    let nearest=Infinity;


    for(
        const enemy of enemies
    ){

        const dx =
            enemy.x-pet.x;

        const dy =
            enemy.y-pet.y;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(distance<nearest){

            nearest=distance;

            target=enemy;

        }

    }


    if(!target)
        return;


    pet.lastShot=
        Date.now();


    /*
       Pet gây damage tương đương
       khoảng 70% sát thương player.
    */

    target.hp-=
        pet.damage*.7;


    createHit(
        target.x,
        target.y
    );


    if(target.hp<=0)
        killEnemy(target);

}


/* =========================================================
   BOSS DEFEATED
========================================================= */

function bossDefeated(){

    stageState="COMPLETE";


    setState(
        "BOSS DEFEATED"
    );


    createBossExplosion(
        player.x,
        player.y
    );


    /*
       EASY + NORMAL
       -> PET
    */

    if(
        difficulty==="easy" ||
        difficulty==="normal"
    ){

        createPet();

    }


    /*
       HARD
       -> thưởng mạnh hơn.
    */

    if(difficulty==="hard"){

        player.damage*=1.5;

        player.hp=
            Math.min(
                player.maxHp,
                player.hp+50
            );

        showSkill(
            "💀 DEMON CORE"
        );

    }


    score+=5000;


    setTimeout(()=>{

        victory();

    },1800);

}


/* =========================================================
   BOSS TRANSITION
========================================================= */

function checkStageTransition(){

    /*
       Chỉ stage 5 mới có Boss.
    */

    if(stage!==5)
        return;


    /*
       Khi đủ kill:
       chuyển NORMAL -> CLEARING.
    */

    if(
        stageKills>=targetKills &&
        stageState==="NORMAL"
    ){

        stageState="CLEARING";

        setState(
            "ELIMINATE REMAINING ENEMIES"
        );

    }


    /*
       Không còn quái trên sân:
       WARNING.
    */

    if(
        stageState==="CLEARING" &&
        enemies.length===0
    ){

        stageState="WARNING";

        setState(
            "WARNING"
        );


        showBossWarning();

    }

}


/* =========================================================
   BOSS WARNING
========================================================= */

function showBossWarning(){

    bossWarning.style.display=
        "flex";


    /*
       Khóa gameplay trong cảnh báo.
       Game loop vẫn chạy nhưng không spawn.
    */

    if(bossTimer)
        clearTimeout(bossTimer);


    bossTimer=
        setTimeout(()=>{

            bossWarning.style.display=
                "none";


            spawnBoss();

        },2200);

}


/* =========================================================
   NORMAL STAGE TRANSITION
========================================================= */

function checkNormalStage(){

    if(stage>=5)
        return;


    if(
        stageKills>=targetKills &&
        enemies.length===0 &&
        stageState==="NORMAL"
    ){

        stageState="COMPLETE";


        setState(
            "STAGE CLEAR"
        );


        setTimeout(()=>{

            stage++;

            startStage();

        },1000);

    }

}


/* =========================================================
   SPAWN LOGIC
========================================================= */

function spawnLogic(){

    if(
        stageState!=="NORMAL"
    )
        return;


    /*
       Màn 5:
       đủ kill -> ngừng spawn.
    */

    if(
        stage===5 &&
        stageKills>=targetKills
    ){

        stageState="CLEARING";

        setState(
            "ELIMINATE REMAINING ENEMIES"
        );

        return;

    }


    /*
       Màn 1-4
    */

    const data =
        difficultyData[difficulty];


    if(
        Date.now()-spawnTimer>
        data.spawnRate
    ){

        /*
           Giới hạn quái trên sân.
        */

        const maxEnemies =
            4+stage;


        if(
            enemies.length<
            maxEnemies
        ){

            spawnEnemy();

        }


        spawnTimer=
            Date.now();

    }

}


/* =========================================================
   HIT EFFECT
========================================================= */

function createHit(x,y){

    const el =
        document.createElement("div");


    el.className="hit";


    el.style.left=
        x+"px";

    el.style.top=
        y+"px";


    arena.appendChild(el);


    setTimeout(()=>{

        el.remove();

    },250);

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI(){

    scoreEl.textContent=
        score;


    waveEl.textContent=
        stage;


    comboEl.textContent=
        "x"+combo;


    hpNumber.textContent=
        Math.ceil(player.hp);


    hpBar.style.width=
        (
            player.hp/
            player.maxHp*
            100
        )+"%";

}


/* =========================================================
   CLEAR OBJECTS
========================================================= */

function clearAllObjects(){

    for(
        const enemy of enemies
    ){

        if(enemy.el)
            enemy.el.remove();

        if(enemy.hpEl)
            enemy.hpEl.remove();

        if(enemy.nameEl)
            enemy.nameEl.remove();

    }


    for(
        const bullet of bullets
    ){

        bullet.el.remove();

    }


    for(
        const bullet of enemyBullets
    ){

        bullet.el.remove();

    }


    for(
        const drop of drops
    ){

        drop.el.remove();

    }


    enemies=[];

    bullets=[];

    enemyBullets=[];

    drops=[];


    if(pet){

        if(pet.el)
            pet.el.remove();

        pet=null;

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    running=false;

    setState(
        "SYSTEM FAILURE"
    );


    message.style.display=
        "flex";


    messageTitle.textContent=
        "SYSTEM FAILURE";


    messageText.textContent=
        "YOU WERE DESTROYED • SCORE: "+
        score;

}


/* =========================================================
   VICTORY
========================================================= */

function victory(){

    running=false;


    message.style.display=
        "flex";


    messageTitle.textContent=
        "CYBER VICTORY";


    messageText.textContent=
        "DEMON BOSS DESTROYED • "+
        "ALL 5 STAGES COMPLETE • SCORE: "+
        score;

}


/* =========================================================
   MENU BUTTONS
========================================================= */

document
.querySelectorAll(".diffButton")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            startGame(
                button.dataset.difficulty
            );

        }
    );

});


/* =========================================================
   RESTART
========================================================= */

document
.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        startGame(
            difficulty
        );

    }
);


/* =========================================================
   MAIN GAME LOOP
========================================================= */

function gameLoop(){

    if(!running)
        return;


    /*
       1. Player
    */

    movePlayer();


    /*
       2. Spawn
    */

    spawnLogic();


    /*
       3. Stage transition
    */

    checkStageTransition();

    checkNormalStage();


    /*
       4. Combat
    */

    autoShoot();

    updateBullets();

    updateEnemies();

    updateEnemyBullets();


    /*
       5. Drops / Pet
    */

    updateDrops();

    updatePet();


    /*
       6. UI
    */

    updateUI();


    requestAnimationFrame(
        gameLoop
    );

}

</script>
